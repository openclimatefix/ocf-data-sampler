sampling_grid:
  locations_csv_path: set_in_temp_file
  t0_resolution_minutes: 30
  exclude_location_ids: [0]

generation:
  zarr_path: set_in_temp_file
  time_resolution_minutes: 30
  input:
    interval_start_minutes: -60
    interval_end_minutes: 0
  target:
    interval_start_minutes: 0
    interval_end_minutes: 120

nwp:
  ukv:
    provider: ukv
    zarr_path: set_in_temp_file
    interval_start_minutes: -60
    interval_end_minutes: 120
    time_resolution_minutes: 60
    channels:
      - name: t # 2-metre temperature
        mean: 283.64913206
        std: 4.38818501
        clip_min: 270
        clip_max: 310
    image_height_pixels: 2
    image_width_pixels: 2
    delay_minute_probabilities:
      180: 1.0
    staleness_limit_minutes: null

satellite:
  zarr_path: set_in_temp_file
  interval_start_minutes: -30
  interval_end_minutes: 0
  time_resolution_minutes: 5
  channels:
    - name: IR_016
      mean: 0.17594202
      std: 0.21462157
  image_height_pixels: 2
  image_width_pixels: 2

solar_position:
  interval_start_minutes: -15
  interval_end_minutes: 15
  time_resolution_minutes: 5

datetime_encoding:
  interval_start_minutes: -15
  interval_end_minutes: 15
  time_resolution_minutes: 5

t0_embedding:
  embeddings: [["1h", "cyclic"], ["24h", "cyclic"], ["1y", "cyclic"]]
